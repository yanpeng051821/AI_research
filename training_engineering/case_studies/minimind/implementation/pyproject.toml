[project]
name = "minimind-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets==3.6.0",
    "numpy>=2.5.3",
    "torch==2.14.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
minimind-audit = "minimind_lab.audit_cli:entrypoint"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
